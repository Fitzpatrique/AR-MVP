<!DOCTYPE html>
<html lang="en">
{% block html %}
	<head>
		<meta charset="utf-8">
	  	<meta name="theme-color">  
		<!--meta name="viewport" content="width=device-width, initial-scale=1.0"-->
		<link rel="stylesheet" type= "text/css" href="{{ url_for('static', filename = 'main.css')}}"/>
		<!--link rel="icon" type="images/jpg" href="{{ url_for('static', filename = 'images/twice new.jpg')}}" --> 
		<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
		<!--link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"-->
		<link href="https://fonts.googleapis.com/css2?family=Mulish&family=Poppins&display=swap" rel="stylesheet">
		<title>Skill Up With Kahdsole</title>
		<meta name = "description" content = "Looks so good they would think it's new">
		<meta name="keywords" content="thrift,online store,store,marketplace,fashion,fashion store">
		<script src="{{ url_for('static', filename='main.js') }}"></script>
	  
		{% block head %}{% endblock head %}

	</head>
	<body>

		<div class="desktop" id="title">
			<div id="nav-section-1">
				<a href="/">
					<img id="logo" src= "{{ url_for('static', filename='images/Skill Up With Kahdsole Logo 1.png') }}" />
				</a>
				<div id="nav-text">
					<a href="/"><span class="nav-text">ABOUT US</span></a>
					<a href="/"><span class="nav-text">BLOG<img src="{{url_for('static',filename='images/material-symbols_keyboard-arrow-down-rounded.svg')}}"></span></a>
					<a href="/"><span class="nav-text">SHOP<img src="{{url_for('static',filename='images/material-symbols_keyboard-arrow-down-rounded.svg')}}"></span></a>
					<a href="/"><span class="nav-text">CONTACT US</span></a>
				</div>
			</div>


			<div id="nav-section-2">
				{% if not loggedIn %}
				<div class="nav-icon-2" id="signInButton">
					<a href="/search" class="search-icon"><img src="{{ url_for('static', filename='images/Search.svg') }}"></a>
					<a class="nav-link" href="/login/user">Sign In</a>
					<a class="nav-link-2" href="/create/user">Create account</a>
				</div>
				{% else %}
				<div class="nav-icon">
					<a href="/search"><img src="{{ url_for('static', filename='images/Search.svg') }}"></a>
					<a href="/update/user"><img src="{{ url_for('static', filename='images/User profile.svg') }}"></a>
					<a href="/cart" id="cart-link">
						<div id="kart">
							
								<img src="{{ url_for('static', filename='images/Cart.svg') }}" id="cartIcon">
								<div id="noOfItems">{{noOfItems}}</div> 
						</div>
					</a>

					<a href="/logout/user">Sign Out</a>
					<!--button class="dropbtn">Hello, <br>{{username}}</button>
					<div class="dropdown-content">
						<a href="/account/orders">Your orders</a>
						<a href="/account/profile/view">Your Profile</a>
						
						<a href="/logout">Sign Out</a>
					</div-->
				</div>
				{% endif %}
			</div>
			

		</div>

		<div class="mobile" id="mobile-title">

		</div>

        {% block body %}

	    {% endblock body %}


	</body>
{% endblock html %}
</html>
