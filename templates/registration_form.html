<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <link rel="stylesheet" type= "text/css" href="{{ url_for('static', filename = 'main.css')}}"/>
            <link rel="icon" type="images/jpg" href="{{ url_for('static', filename = 'images/twice new.jpg')}}" > 
            <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
            <!--link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"-->
            <title> Skill Up With Kahdsole </title>
            <link href="https://fonts.googleapis.com/css2?family=Mulish&family=Poppins&display=swap" rel="stylesheet">
            <meta name = "description" content = "Looks so good they would think it's new">
            <meta name="keywords" content="thrift,online store,store,marketplace,fashion,fashion store,ar,vr,kahdsole">
            <script type="text/javascript" src="{{ url_for('static', filename = 'main.js') }}"></script>
        </head>
        <body>
            <div class="signin-section">
                <div>
                    <img id="signin-logo" src= "{{ url_for('static', filename='images/Skill Up With Kahdsole Logo 1.png') }}" />
                </div>
                <div class="hr"></div>
                <div class="on-board-title-link">
                    <a href="/create/user"><div class="on-board-title-link-active">
                        <div class="on-board-active-link-text">Register</div>
                        <div class="on-board-active-link-border"></div>
                    </div></a>
                    <a href="/login/user"><div class="on-board-title-link-inactive">
                        <div class="on-board-inactive-link-text">Sign  in</div>
                        <div class="on-board-inactive-link-border"></div>
                    </div></a>
                </div>
                <div class="on-board-form">   
                    <p> {{msg}} </p>
                    <form action="/create/user" method="POST">
                        <div class="on-board-form-2">
                            <input class="on-board-form-input" type="text" name="firstname" placeholder="First name" required>
                            <input class="on-board-form-input" type="text" name="lastname" placeholder="Last name" required>
                            <input class="on-board-form-input" type="text" name="email" placeholder="Enter your email (Example@email.com)" required>
                            <input class="on-board-form-input" type="password" name="password" placeholder="Enter your password" required>
                            <input class="on-board-form-input" type="text" name="delivery_address" placeholder="delivery_address" required>
                            <input class="on-board-form-input" type="text" name="city" placeholder="city" required>
                            <input class="on-board-form-input" type="text" name="state" placeholder="state" required>
                            <input class="on-board-form-input" type="text" name="country" placeholder="country" required>
                            <input class="on-board-form-input" type="text" name="phone" placeholder="phone" required>
                        </div>
                        <div class="on-board-form-content">
                            <div class="on-board-form-content-checkbox-2"><input type="checkbox" name="subscription_status" value="Yes"><p class="on-board-form-content-checkbox-text">I would like to be notified of special offers via email</p></div>
                            
                        </div>
                        <input type="submit" class="signin-btn" value="Create account">
                        
                       
                    </form>
                    
                    <div class="disclaimer">By creating an account, you agree to the <a href="" class="blue">TwiceNew.com</a><a href="" class="blue"> Free Membership Agreement</a> and <a href="" class="blue">Privacy Policy</a></div>
                </div>
            </div>

            

        </body>
    </html>
