<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <link rel="stylesheet" type= "text/css" href="{{ url_for('static', filename = 'main.css')}}"/>
            <link rel="icon" type="images/jpg" href="{{ url_for('static', filename = 'images/twice new.jpg')}}" > 
            <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
            <!--link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"-->
            <title> Skill Up With Kahdsole </title>
            <link href="https://fonts.googleapis.com/css2?family=Mulish&family=Poppins&display=swap" rel="stylesheet">
            <meta name = "description" content = "Looks so good they would think it's new">
            <meta name="keywords" content="thrift,online store,store,marketplace,fashion,fashion store">
            <script type="text/javascript" src="{{ url_for('static', filename = 'main.js') }}"></script>
        </head>
        <body>
            <div class="signin-section">
                <div>
                    <img id="signin-logo" src= "{{ url_for('static', filename='images/Skill Up With Kahdsole Logo 1.png') }}" />
                </div>
                <div class="hr"></div>
                <div class="on-board-title-link">
                    <a href="/create/user"><div class="on-board-title-link-inactive">
                        <div class="on-board-inactive-link-text">Register</div>
                        <div class="on-board-inactive-link-border"></div>
                    </div></a>
                    <a href="/login/user"><div class="on-board-title-link-active">
                        <div class="on-board-active-link-text">Sign  in</div>
                        <div class="on-board-active-link-border"></div>
                    </div></a>
                </div>
                <div class="on-board-form">   
                    <p> {{msg}} </p>
                    <form action="/login/user" method="POST">
                        <div class="on-board-form">
                            <input class="on-board-form-input" type="text" name="email" placeholder="Enter your email (Example@email.com)" required>
                            <input class="on-board-form-input" type="password" name="password" placeholder="Enter your password" required>
                        </div>
                        <div class="on-board-form-content">
                            <div class="on-board-form-content-checkbox"><input type="checkbox"><p class="on-board-form-content-checkbox-text">Keep me signed in</p></div>
                            <div><a href="/forgot/password" class="on-board-form-content-forgot">Forgot password?</a></div>
                        </div>
                        <input type="submit" class="signin-btn" value="Sign in">
                        
                    </form>
                    
                    <!--a href="/admin/portal"><h6>Log in as admin</h6></a-->
                </div>
            </div>
        </body>
    </html>
